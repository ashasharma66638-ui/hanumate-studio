<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HANUMATE STUDIO — Where Indian Stories Come Alive</title>

<meta name="description" content="Hanumate Studio is an independent animation and creative studio from Jaipur creating anime, manga, animation, character design and visual stories.">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#080706;
    color:#f5f0e8;
    font-family:Arial, sans-serif;
    line-height:1.6;
}

a{
    color:inherit;
    text-decoration:none;
}

.container{
    width:min(1120px,92%);
    margin:auto;
}

/* NAVBAR */

nav{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    z-index:1000;
    background:rgba(8,7,6,.88);
    backdrop-filter:blur(14px);
    border-bottom:1px solid rgba(255,190,60,.12);
}

.navbar{
    height:72px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    font-family:Georgia,serif;
    font-size:21px;
    color:#f4c64e;
    font-weight:bold;
}

.logo span{
    color:white;
}

.nav-links{
    display:flex;
    gap:28px;
    list-style:none;
}

.nav-links a{
    color:#cfc8bd;
    font-size:13px;
    letter-spacing:1px;
    transition:.3s;
}

.nav-links a:hover{
    color:#f4c64e;
}

.nav-btn{
    background:#eabf3f;
    color:#17120a;
    padding:11px 18px;
    border-radius:30px;
    font-weight:bold;
    font-size:13px;
}

.menu{
    display:none;
    font-size:30px;
    cursor:pointer;
}

/* HERO */

.hero{
    min-height:100vh;
    display:flex;
    align-items:center;
    position:relative;
    overflow:hidden;
    background:
    radial-gradient(circle at 70% 30%,rgba(180,90,10,.30),transparent 35%),
    radial-gradient(circle at 20% 80%,rgba(150,70,10,.12),transparent 35%),
    #080706;
}

.hero:before{
    content:"";
    position:absolute;
    width:500px;
    height:500px;
    right:-150px;
    top:120px;
    background:radial-gradient(circle,rgba(255,170,40,.16),transparent 65%);
    filter:blur(20px);
}

.hero-content{
    position:relative;
    z-index:2;
    padding-top:70px;
    max-width:720px;
}

.tag{
    color:#d9ad43;
    letter-spacing:4px;
    font-size:12px;
    text-transform:uppercase;
    margin-bottom:20px;
}

h1{
    font-family:Georgia,serif;
    font-size:clamp(55px,10vw,110px);
    line-height:.9;
    letter-spacing:-4px;
}

.gold{
    color:#eac04b;
}

.hero-sub{
    font-family:Georgia,serif;
    font-size:24px;
    margin:28px 0 15px;
    color:#e7dfd2;
    font-style:italic;
}

.hero-text{
    color:#aaa39a;
    max-width:650px;
    font-size:16px;
}

.buttons{
    display:flex;
    gap:15px;
    margin-top:30px;
    flex-wrap:wrap;
}

.btn{
    padding:14px 23px;
    border-radius:30px;
    border:1px solid #4c4438;
    transition:.3s;
}

.btn-primary{
    background:#eac04b;
    color:#151009;
    border-color:#eac04b;
    font-weight:bold;
}

.btn:hover{
    transform:translateY(-3px);
}

/* SECTIONS */

section{
    padding:100px 0;
}

.section-label{
    color:#c99e39;
    text-transform:uppercase;
    letter-spacing:4px;
    font-size:11px;
    margin-bottom:15px;
}

.section-title{
    font-family:Georgia,serif;
    font-size:clamp(38px,6vw,65px);
    line-height:1.05;
    max-width:750px;
    margin-bottom:25px;
}

.section-title span{
    color:#eac04b;
}

.section-text{
    color:#aaa39a;
    max-width:720px;
    font-size:16px;
}

/* ABOUT */

.about{
    background:#0d0b09;
}

.about-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:50px;
    align-items:center;
}

.about-card{
    border:1px solid #29251f;
    background:linear-gradient(145deg,#15120f,#0b0a09);
    padding:40px;
    border-radius:22px;
}

.about-card h3{
    font-family:Georgia,serif;
    color:#eac04b;
    font-size:28px;
    margin-bottom:12px;
}

/* SERVICES */

.services-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:16px;
    margin-top:45px;
}

.service{
    background:#11100e;
    border:1px solid #29251f;
    border-radius:18px;
    padding:28px;
    min-height:190px;
    transition:.35s;
}

.service:hover{
    transform:translateY(-7px);
    border-color:#a98231;
    background:#17140f;
}

.icon{
    width:42px;
    height:42px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:12px;
    background:#241d0e;
    color:#eac04b;
    font-size:21px;
    margin-bottom:20px;
}

.service h3{
    font-family:Georgia,serif;
    font-size:21px;
    margin-bottom:8px;
}

.service p{
    color:#89837b;
    font-size:14px;
}

/* PROJECTS */

.projects{
    background:#0
